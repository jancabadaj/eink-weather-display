; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/cu.wchusbserial*
monitor_port = /dev/cu.wchusbserial*
monitor_speed = 115200
lib_deps = 
    bblanchon/ArduinoJson@^7.4.3

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; Only so VS Code IntelliSense can resolve <doctest.h> in test/ 
    ; the firmware includes nothing from it, so this adds no code and no flash.
    -I.pio/libdeps/native/doctest/doctest

; Do not add clangtidy: the clang-tidy 15 PlatformIO ships segfaults on any file
; including the ESP32 Arduino headers, and pio reports that crash as "PASSED".
check_tool =
    cppcheck
check_src_filters =
    +<src/>
    -<src/render/fonts/>
    -<src/render/shapes/>
; With framework includes a run takes ~28s instead of ~1s and finds fewer real defects
check_skip_packages = yes
check_severity = medium, high
check_flags =
    cppcheck: --enable=warning,style,performance,portability --inline-suppr --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --suppress=*:*/lib/*


; The tests are built and run by a plain compiler invocation
; (tools/workbench: `npm test`), not by `pio test`
; PlatformIO's test runner is built around on-device testing and fights a native suite
; This environment exists so doctest is declared and fetched through PlatformIO dependency management
;   * pio pkg install -e native
[env:native]
platform = native
lib_deps =
    doctest/doctest@^2.4.12
