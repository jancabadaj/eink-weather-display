<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Viewer</title>
  <style>
    body {
      margin: 0;
      background-color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #sidebar {
      width: 160px;
      height: 100%;
      background-color: #2c3e50;
      padding: 20px;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-sizing: border-box;
    }

    #sidebar h3 {
      color: #ecf0f1;
      margin: 0 0 15px 0;
      font-size: 16px;
      font-weight: 600;
    }

    #buttons-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: auto;
    }

    .render-button {
      background-color: #34495e;
      color: #ecf0f1;
      border: none;
      padding: 12px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 10px;
      transition: all 0.2s;
      text-align: left;
    }

    .render-button:hover {
      background-color: #3498db;
    }

    .render-button.active {
      background-color: #3498db;
      font-weight: 600;
    }

    .render-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: auto;
    }

    #image-container {
      border: 1px solid #ddd;
      background-color: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    #image-container img {
      display: block;
      image-rendering: pixelated;
    }

    #status {
      color: #95a5a6;
      font-size: 8px;
      margin-top: 20px;
      padding: 10px;
      border-top: 1px solid #34495e;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>

<body>
  <div id="sidebar">
    <h3>Render Modes</h3>
    <div id="buttons-container">
      <button class="render-button active" data-mode="weather">Weather Display</button>
      <button class="render-button" data-mode="night-mode">Night Mode</button>
      <button class="render-button" data-mode="network-error">Network Error</button>
    </div>
    <div id="status">Ready</div>
  </div>

  <div id="main-content">
    <div id="image-container">
      <img id="output-image" src="/output.bmp" alt="Generated Image">
    </div>
  </div>

  <script>
    const img = document.getElementById('output-image');
    const statusEl = document.getElementById('status');
    const buttons = document.querySelectorAll('.render-button');

    // Reload image with cache busting
    function reloadContent() {
      const timestamp = new Date().getTime();
      img.src = '/output.bmp?' + timestamp;
    }

    // Set status message
    function setStatus(message) {
      statusEl.textContent = message;
    }

    // Handle render mode button clicks
    buttons.forEach(button => {
      button.addEventListener('click', async () => {
        const mode = button.getAttribute('data-mode');

        buttons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');

        fetch(`/render/${mode}`, { method: 'POST' });
      });
    });

    // Set up WebSocket connection
    const ws = new WebSocket('ws://localhost:8080');
    ws.onopen = () => {
      console.log('WebSocket connection established');
      setStatus('Connected');
    };
    ws.onerror = error => {
      console.error('WebSocket error:', error);
      setStatus('WebSocket error');
    };
    ws.onclose = () => {
      console.log('WebSocket connection closed');
      setStatus('Disconnected');
    };
    ws.onmessage = event => {
      const message = JSON.parse(event.data);
      if (message.type === 'reload-image') {
        console.log(`Reload image triggered`);
        reloadContent();
      }
    };
  </script>
</body>

</html>
