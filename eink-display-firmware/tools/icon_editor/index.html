<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Editor - E-Ink Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #252526;
            padding: 8px 15px;
            border-bottom: 1px solid #3e3e42;
        }

        h1 {
            font-size: 16px;
            font-weight: 500;
            color: #cccccc;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .left-panel {
            width: 50%;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .separator {
            width: 4px;
            background: #3e3e42;
            cursor: col-resize;
            flex-shrink: 0;
            position: relative;
        }

        .separator:hover {
            background: #0e639c;
        }

        .separator::after {
            content: '';
            position: absolute;
            left: -2px;
            right: -2px;
            top: 0;
            bottom: 0;
        }

        .right-panel {
            flex: 1;
            padding: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .controls {
            background: #252526;
            padding: 8px 10px;
            border-radius: 3px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            font-size: 12px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        label {
            font-size: 11px;
            color: #cccccc;
        }

        input[type="number"],
        input[type="text"] {
            background: #3c3c3c;
            border: 1px solid #3e3e42;
            color: #cccccc;
            padding: 4px 6px;
            border-radius: 2px;
            font-size: 11px;
            width: 60px;
        }

        input[type="text"] {
            width: 120px;
        }

        input[type="range"] {
            background: #3c3c3c;
            border: 1px solid #3e3e42;
            border-radius: 2px;
            height: 6px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: #0e639c;
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #0e639c;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        button {
            background: #0e639c;
            border: none;
            color: white;
            padding: 4px 10px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 11px;
            transition: background 0.2s;
        }

        button:hover {
            background: #1177bb;
        }

        button.secondary {
            background: #3e3e42;
        }

        button.secondary:hover {
            background: #4e4e52;
        }

        button.small {
            padding: 2px 6px;
            font-size: 10px;
        }

        .canvas-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }

        .canvas-controls {
            display: flex;
            justify-content: center;
            gap: 8px;
            align-items: center;
            background: #252526;
            padding: 5px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .canvas-container {
            flex: 1;
            background: #2d2d30;
            border-radius: 3px;
            overflow: auto;
            padding: 20px;
            min-height: 0;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
        }

        .canvas-inner-wrapper {
            min-width: 100%;
            min-height: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
        }

        canvas {
            border: 1px solid #3e3e42;
            background: white;
            cursor: crosshair;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            margin: auto;
        }

        .code-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-header h2 {
            font-size: 13px;
            font-weight: 500;
            color: #cccccc;
        }

        textarea {
            flex: 1;
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 9px;
            line-height: 1.3;
            resize: none;
            tab-size: 4;
            white-space: pre;
            overflow-wrap: normal;
            word-wrap: normal;
            overflow-x: auto;
            overflow-y: auto;
        }

        .info {
            background: #252526;
            padding: 6px 8px;
            border-radius: 3px;
            font-size: 10px;
            color: #858585;
            line-height: 1.3;
        }

        .info strong {
            color: #cccccc;
        }

        .zoom-level {
            font-size: 11px;
            color: #858585;
            min-width: 45px;
            text-align: center;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .color-preview {
            width: 24px;
            height: 24px;
            border: 1px solid #3e3e42;
            border-radius: 3px;
            cursor: pointer;
        }

        .color-preview.black {
            background: #000;
        }

        .color-preview.white {
            background: #fff;
        }

        .color-preview.active {
            border: 2px solid #0e639c;
            box-shadow: 0 0 0 1px #0e639c;
        }

        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e1e;
            border-radius: 2px;
        }

        ::-webkit-scrollbar-thumb {
            background: #999999;
            border-radius: 2px;
            border: 2px solid #1e1e1e;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #bbbbbb;
        }

        ::-webkit-scrollbar-thumb:active {
            background: #0e639c;
        }

        ::-webkit-scrollbar-corner {
            background: #1e1e1e;
        }

        /* For Firefox */
        * {
            scrollbar-width: auto;
            scrollbar-color: #999999 #1e1e1e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel" id="leftPanel">
            <div class="controls">
                <div class="control-group">
                    <label for="width">W:</label>
                    <input type="number" id="width" value="24" min="8" max="128" step="8">
                </div>
                <div class="control-group">
                    <label for="height">H:</label>
                    <input type="number" id="height" value="24" min="8" max="128" step="8">
                </div>
                <div class="control-group">
                    <label for="iconName">Name:</label>
                    <input type="text" id="iconName" value="MyIcon" placeholder="MyIcon">
                </div>
                <button onclick="applyDimensions()">Apply</button>
                <div class="toolbar">
                    <label for="brushSize">Brush:</label>
                    <input type="range" id="brushSize" min="1" max="10" value="1" style="width: 80px;">
                    <span id="brushSizeValue">1px</span>
                </div>
                <button class="secondary" onclick="clearCanvas()">Clear</button>
                <button class="secondary" onclick="invertCanvas()">Invert</button>
            </div>
            <div class="controls">
                <div class="control-group">
                    <input type="file" id="imageInput" accept="image/*" onchange="loadImage(event)" style="display: none;">
                    <button onclick="document.getElementById('imageInput').click()">Load Image</button>
                    <button class="secondary" onclick="reconvertImage()" id="reconvertBtn" style="display: none;">Re-convert</button>
                    <label for="threshold">Threshold:</label>
                    <input type="range" id="threshold" min="0" max="255" value="128" style="width: 100px;">
                    <span id="thresholdValue">128</span>
                </div>
            </div>

            <div class="canvas-wrapper">
                <div class="canvas-controls">
                    <button class="small" onclick="zoomOut()">−</button>
                    <span class="zoom-level" id="zoomLevel">100%</span>
                    <button class="small" onclick="zoomIn()">+</button>
                    <button class="small secondary" onclick="zoomFit()">Fit</button>
                    <button class="small secondary" onclick="zoomReset()">Reset</button>
                </div>
                <div class="canvas-container" id="canvasContainer">
                    <div class="canvas-inner-wrapper">
                        <canvas id="iconCanvas"></canvas>
                    </div>
                </div>
            </div>

            <div class="info">
                <strong>Controls:</strong> L-Click=Black • R-Click=White • Drag to paint
            </div>
        </div>

        <div class="separator" id="separator"></div>

        <div class="right-panel">
            <div class="code-container">
                <div class="code-header">
                    <h2>Generated Header File</h2>
                    <div>
                        <button onclick="copyCode()">Copy to Clipboard</button>
                        <button class="secondary" onclick="applyCode()">Apply Code to Canvas</button>
                    </div>
                </div>
                <textarea id="codeOutput" spellcheck="false"></textarea>
                <div class="info">
                    <strong>Usage:</strong> Draw → Copy code → Save as src/draw/shapes/[name].h → Include in shapes.h
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('iconCanvas');
        const ctx = canvas.getContext('2d');
        const codeOutput = document.getElementById('codeOutput');
        const widthInput = document.getElementById('width');
        const heightInput = document.getElementById('height');
        const iconNameInput = document.getElementById('iconName');

        let iconWidth = 24;
        let iconHeight = 24;
        let iconName = 'MyIcon';
        let basePixelSize = 20;
        let pixelSize = 20;
        let gridSize = 1;
        let brushSize = 1;
        let isDrawing = false;
        let zoomLevel = 1.0;

        // Initialize
        let pixels = [];
        initializeCanvas();

        function initializeCanvas() {
            iconWidth = parseInt(widthInput.value);
            iconHeight = parseInt(heightInput.value);
            iconName = iconNameInput.value || 'MyIcon';

            // Initialize pixel array (true = black, false = white)
            pixels = Array(iconHeight).fill(null).map(() => Array(iconWidth).fill(false));

            updateCanvasSize();
            redrawCanvas();
            generateCode();
        }

        function updateCanvasSize() {
            pixelSize = Math.round(basePixelSize * zoomLevel);  // Integer for crisp rendering

            // Only add grid space when pixels are large enough
            const showGrid = pixelSize >= 10;
            const effectiveGridSize = showGrid ? gridSize : 0;

            // Set canvas size
            if (showGrid) {
                canvas.width = iconWidth * pixelSize + (iconWidth + 1) * gridSize;
                canvas.height = iconHeight * pixelSize + (iconHeight + 1) * gridSize;
            } else {
                canvas.width = iconWidth * pixelSize;
                canvas.height = iconHeight * pixelSize;
            }
        }

        function zoomIn() {
            const currentPixelSize = Math.round(basePixelSize * zoomLevel);
            const increment = Math.max(1, Math.round(currentPixelSize * 0.2));
            const newPixelSize = currentPixelSize + increment;
            const maxPixelSize = Math.round(basePixelSize * 5.0);

            if (newPixelSize <= maxPixelSize) {
                zoomLevel = newPixelSize / basePixelSize;
            } else {
                zoomLevel = 5.0;
            }
            updateZoom();
        }

        function zoomOut() {
            const currentPixelSize = Math.round(basePixelSize * zoomLevel);
            const decrement = Math.max(1, Math.round(currentPixelSize * 0.2));
            const newPixelSize = Math.max(1, currentPixelSize - decrement);

            zoomLevel = newPixelSize / basePixelSize;
            updateZoom();
        }

        function zoomReset() {
            zoomLevel = 1.0;
            updateZoom();
        }

        function zoomFit() {
            const container = document.getElementById('canvasContainer');
            // Account for 20px padding on each side (40px total width and height)
            const containerWidth = container.clientWidth - 40;
            const containerHeight = container.clientHeight - 40;

            // Calculate what the canvas would be at 1.0 zoom
            // Assume grid will be shown if pixel size >= 10
            const testPixelSize = basePixelSize * 1.0;
            const testShowGrid = testPixelSize >= 10;

            let canvasAspectWidth, canvasAspectHeight;
            if (testShowGrid) {
                canvasAspectWidth = iconWidth * basePixelSize + (iconWidth + 1) * gridSize;
                canvasAspectHeight = iconHeight * basePixelSize + (iconHeight + 1) * gridSize;
            } else {
                canvasAspectWidth = iconWidth * basePixelSize;
                canvasAspectHeight = iconHeight * basePixelSize;
            }

            const scaleX = containerWidth / canvasAspectWidth;
            const scaleY = containerHeight / canvasAspectHeight;

            // Use 0.9 multiplier to ensure it truly fits with extra margin
            zoomLevel = Math.min(scaleX, scaleY, 5.0) * 0.9;
            updateZoom();
        }

        function updateZoom() {
            updateCanvasSize();
            redrawCanvas();
            document.getElementById('zoomLevel').textContent = Math.round(zoomLevel * 100) + '%';
        }

        function applyDimensions() {
            // Preserve existing pixels if possible
            const newWidth = parseInt(widthInput.value);
            const newHeight = parseInt(heightInput.value);
            const newPixels = Array(newHeight).fill(null).map(() => Array(newWidth).fill(false));

            // Copy old pixels
            for (let y = 0; y < Math.min(iconHeight, newHeight); y++) {
                for (let x = 0; x < Math.min(iconWidth, newWidth); x++) {
                    newPixels[y][x] = pixels[y][x];
                }
            }

            pixels = newPixels;
            initializeCanvas();

            // Auto-fit after dimension change
            setTimeout(zoomFit, 100);
        }

        function redrawCanvas() {
            // Clear canvas
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Only show grid when pixel size is large enough (zoom > 0.5)
            const showGrid = pixelSize >= 10;
            const effectiveGridSize = showGrid ? gridSize : 0;

            // Draw grid (only if pixels are large enough)
            if (showGrid) {
                ctx.fillStyle = '#e0e0e0';
                for (let y = 0; y <= iconHeight; y++) {
                    ctx.fillRect(0, y * (pixelSize + gridSize), canvas.width, gridSize);
                }
                for (let x = 0; x <= iconWidth; x++) {
                    ctx.fillRect(x * (pixelSize + gridSize), 0, gridSize, canvas.height);
                }
            }

            // Draw pixels
            for (let y = 0; y < iconHeight; y++) {
                for (let x = 0; x < iconWidth; x++) {
                    const color = pixels[y][x] ? '#000000' : '#ffffff';
                    ctx.fillStyle = color;

                    if (showGrid) {
                        ctx.fillRect(
                            x * (pixelSize + gridSize) + gridSize,
                            y * (pixelSize + gridSize) + gridSize,
                            pixelSize,
                            pixelSize
                        );
                    } else {
                        ctx.fillRect(
                            x * pixelSize,
                            y * pixelSize,
                            pixelSize,
                            pixelSize
                        );
                    }
                }
            }
        }

        function getPixelCoords(event) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (event.clientX - rect.left) * scaleX;
            const y = (event.clientY - rect.top) * scaleY;

            const showGrid = pixelSize >= 10;
            const effectivePixelSize = showGrid ? (pixelSize + gridSize) : pixelSize;

            const pixelX = Math.floor(x / effectivePixelSize);
            const pixelY = Math.floor(y / effectivePixelSize);

            if (pixelX >= 0 && pixelX < iconWidth && pixelY >= 0 && pixelY < iconHeight) {
                return { x: pixelX, y: pixelY };
            }
            return null;
        }

        function setPixel(x, y, color) {
            const isBlack = (color === 'black');

            // Draw a circle of pixels based on brush size
            for (let dy = -brushSize + 1; dy < brushSize; dy++) {
                for (let dx = -brushSize + 1; dx < brushSize; dx++) {
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < brushSize) {
                        const px = x + dx;
                        const py = y + dy;
                        if (px >= 0 && px < iconWidth && py >= 0 && py < iconHeight) {
                            pixels[py][px] = isBlack;
                        }
                    }
                }
            }

            redrawCanvas();
            generateCode();
        }

        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            isDrawing = true;
            const coords = getPixelCoords(e);
            if (coords) {
                const drawColor = e.button === 2 ? 'white' : 'black';
                setPixel(coords.x, coords.y, drawColor);
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing) {
                const coords = getPixelCoords(e);
                if (coords) {
                    const drawColor = e.buttons === 2 ? 'white' : 'black';
                    setPixel(coords.x, coords.y, drawColor);
                }
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDrawing = false;
        });

        canvas.addEventListener('mouseleave', () => {
            isDrawing = false;
        });

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            return false;
        });

        function generateCode() {
            iconName = iconNameInput.value || 'MyIcon';
            const bytesPerRow = Math.ceil(iconWidth / 8);
            const bitmapData = [];
            const visualComments = [];

            for (let y = 0; y < iconHeight; y++) {
                let rowBytes = [];
                let visualRow = '';

                for (let byteIdx = 0; byteIdx < bytesPerRow; byteIdx++) {
                    let byte = 0;
                    for (let bit = 0; bit < 8; bit++) {
                        const x = byteIdx * 8 + bit;
                        if (x < iconWidth && pixels[y][x]) {
                            byte |= (0x80 >> bit);
                            visualRow += '#';
                        } else {
                            visualRow += ' ';
                        }
                    }
                    rowBytes.push('0x' + byte.toString(16).toUpperCase().padStart(2, '0'));
                }

                bitmapData.push(rowBytes.join(', '));
                visualComments.push(visualRow);
            }

            let code = `#pragma once\n\n`;
            code += `#include "../shape.h"\n\n`;
            code += `// ${iconName} bitmap (${iconWidth}x${iconHeight})\n`;
            code += `const uint8_t ${iconName}_Bitmap[] = {\n`;

            for (let i = 0; i < bitmapData.length; i++) {
                const comment = visualComments[i].trim() ? `  //${visualComments[i]}` : '  //';
                code += `    ${bitmapData[i]},${comment}\n`;
            }

            code += `};\n\n`;
            code += `Shape ${iconName} = {\n`;
            code += `    .bitmap = ${iconName}_Bitmap,\n`;
            code += `    .width = ${iconWidth},\n`;
            code += `    .height = ${iconHeight}\n`;
            code += `};\n`;

            codeOutput.value = code;
        }

        function clearCanvas() {
            pixels = Array(iconHeight).fill(null).map(() => Array(iconWidth).fill(false));
            redrawCanvas();
            generateCode();
        }

        function invertCanvas() {
            for (let y = 0; y < iconHeight; y++) {
                for (let x = 0; x < iconWidth; x++) {
                    pixels[y][x] = !pixels[y][x];
                }
            }
            redrawCanvas();
            generateCode();
        }

        function copyCode() {
            codeOutput.select();
            document.execCommand('copy');

            const button = event.target;
            const originalText = button.textContent;
            button.textContent = 'Copied!';
            setTimeout(() => {
                button.textContent = originalText;
            }, 1500);
        }

        function applyCode() {
            const code = codeOutput.value;

            // Parse icon name
            const nameMatch = code.match(/Shape\s+(\w+)\s*=/);
            if (nameMatch) {
                iconName = nameMatch[1];
                iconNameInput.value = iconName;
            }

            // Parse dimensions
            const widthMatch = code.match(/\.width\s*=\s*(\d+)/);
            const heightMatch = code.match(/\.height\s*=\s*(\d+)/);

            if (widthMatch && heightMatch) {
                const newWidth = parseInt(widthMatch[1]);
                const newHeight = parseInt(heightMatch[1]);

                widthInput.value = newWidth;
                heightInput.value = newHeight;
                iconWidth = newWidth;
                iconHeight = newHeight;
            }

            // Parse bitmap data
            const bitmapMatch = code.match(/const uint8_t.*?\[[^\]]*\]\s*=\s*\{([^}]+)\}/s);
            if (bitmapMatch) {
                const hexValues = bitmapMatch[1].match(/0[xX][0-9A-Fa-f]{2}/g);
                if (hexValues) {
                    pixels = Array(iconHeight).fill(null).map(() => Array(iconWidth).fill(false));
                    const bytesPerRow = Math.ceil(iconWidth / 8);

                    for (let y = 0; y < iconHeight && y * bytesPerRow < hexValues.length; y++) {
                        for (let byteIdx = 0; byteIdx < bytesPerRow; byteIdx++) {
                            const hexIdx = y * bytesPerRow + byteIdx;
                            if (hexIdx < hexValues.length) {
                                const byte = parseInt(hexValues[hexIdx], 16);
                                for (let bit = 0; bit < 8; bit++) {
                                    const x = byteIdx * 8 + bit;
                                    if (x < iconWidth) {
                                        pixels[y][x] = (byte & (0x80 >> bit)) !== 0;
                                    }
                                }
                            }
                        }
                    }
                }
            }

            // Reinitialize canvas with new dimensions
            updateCanvasSize();
            redrawCanvas();
            generateCode();
        }

        // Update code when icon name changes
        iconNameInput.addEventListener('input', generateCode);

        // Brush size functionality
        const brushSizeInput = document.getElementById('brushSize');
        const brushSizeValue = document.getElementById('brushSizeValue');

        brushSizeInput.addEventListener('input', function() {
            brushSize = parseInt(this.value);
            brushSizeValue.textContent = brushSize + 'px';
        });

        // Image loading functionality
        let loadedImage = null;
        const thresholdInput = document.getElementById('threshold');
        const thresholdValue = document.getElementById('thresholdValue');
        const reconvertBtn = document.getElementById('reconvertBtn');

        thresholdInput.addEventListener('input', function() {
            thresholdValue.textContent = this.value;
            if (loadedImage) {
                convertImageToPixels(loadedImage, parseInt(this.value));
            }
        });

        function loadImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    loadedImage = img;
                    reconvertBtn.style.display = 'inline-block';

                    // Update canvas dimensions to match image (with max constraints)
                    const maxSize = 200;
                    let newWidth = img.width;
                    let newHeight = img.height;

                    if (newWidth > maxSize || newHeight > maxSize) {
                        const scale = Math.min(maxSize / newWidth, maxSize / newHeight);
                        newWidth = Math.round(newWidth * scale);
                        newHeight = Math.round(newHeight * scale);
                    }

                    widthInput.value = newWidth;
                    heightInput.value = newHeight;
                    iconWidth = newWidth;
                    iconHeight = newHeight;

                    // Convert and apply
                    const threshold = parseInt(thresholdInput.value);
                    convertImageToPixels(img, threshold);

                    // Reset zoom to fit
                    setTimeout(zoomFit, 100);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function reconvertImage() {
            if (!loadedImage) return;

            // Get current dimensions from inputs
            iconWidth = parseInt(widthInput.value);
            iconHeight = parseInt(heightInput.value);

            // Re-convert with new dimensions
            const threshold = parseInt(thresholdInput.value);
            convertImageToPixels(loadedImage, threshold);

            // Reset zoom to fit
            setTimeout(zoomFit, 100);
        }

        function convertImageToPixels(img, threshold) {
            // Create temporary canvas for image processing
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = iconWidth;
            tempCanvas.height = iconHeight;
            const tempCtx = tempCanvas.getContext('2d');

            // Draw scaled image
            tempCtx.drawImage(img, 0, 0, iconWidth, iconHeight);

            // Get image data
            const imageData = tempCtx.getImageData(0, 0, iconWidth, iconHeight);
            const data = imageData.data;

            // Convert to black and white based on threshold
            pixels = Array(iconHeight).fill(null).map(() => Array(iconWidth).fill(false));

            for (let y = 0; y < iconHeight; y++) {
                for (let x = 0; x < iconWidth; x++) {
                    const idx = (y * iconWidth + x) * 4;
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];
                    const a = data[idx + 3];

                    // Calculate luminance (perceived brightness)
                    // Use standard formula: 0.299*R + 0.587*G + 0.114*B
                    const luminance = 0.299 * r + 0.587 * g + 0.114 * b;

                    // If alpha is low (transparent), treat as white
                    if (a < 128) {
                        pixels[y][x] = false; // white
                    } else {
                        // Convert based on threshold
                        pixels[y][x] = luminance < threshold;
                    }
                }
            }

            updateCanvasSize();
            redrawCanvas();
            generateCode();
        }

        // Auto-fit on window resize
        window.addEventListener('resize', () => {
            if (zoomLevel < 1.0) {
                zoomFit();
            }
        });

        // Initial fit
        setTimeout(zoomFit, 100);

        // Draggable separator
        const separator = document.getElementById('separator');
        const leftPanel = document.getElementById('leftPanel');
        let isResizing = false;

        separator.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;

            const container = document.querySelector('.container');
            const containerRect = container.getBoundingClientRect();
            const newLeftWidth = e.clientX - containerRect.left;

            // Constrain between 30% and 70%
            const minWidth = containerRect.width * 0.3;
            const maxWidth = containerRect.width * 0.7;

            if (newLeftWidth >= minWidth && newLeftWidth <= maxWidth) {
                const percentage = (newLeftWidth / containerRect.width) * 100;
                leftPanel.style.width = percentage + '%';
            }
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';

                // Re-fit canvas after resize
                setTimeout(zoomFit, 50);
            }
        });
    </script>
</body>
</html>
